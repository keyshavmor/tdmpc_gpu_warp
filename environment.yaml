# Conda environment of tdmpc_gpu_warp (TD-MPC on GPU MuJoCo), GPU port by Keyshav Mor.
# Exact package set every result in docs/ was measured with (Ubuntu, NVIDIA driver 580, RTX 3090).
# Needs an NVIDIA driver >= 580 (warp-lang 1.18 is built with CUDA 13; torch wheels with CUDA 12.8); see docs/USER_GUIDE.md section 1 for the machine set-up.
#
#   conda env create -f environment.yaml
#   conda activate tdmpc-warp
#   ./scripts/setup_mujoco_warp.sh     # MuJoCo Warp + GPU noslip solver in ../mujoco_warp, installed with pip -e
#
# Alternative without conda: uv (pyproject.toml / uv.lock, see setup_uv.sh).
name: tdmpc-warp
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # core packages
      - torch==2.11.0+cu128
      - warp-lang==1.18.0
      - mujoco==3.15.0
